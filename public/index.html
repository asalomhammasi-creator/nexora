<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#030712;color:#fff;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.auth{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#312e81,#030712 55%)}.box{width:min(410px,92%);padding:30px;border:1px solid #293452;border-radius:24px;background:#0b1224;box-shadow:0 30px 100px #0008}.logo{font-size:32px;font-weight:900;letter-spacing:4px}.logo span{color:#8b5cf6}.muted{color:#94a3b8;margin:8px 0 24px}.box input,.box select{width:100%;padding:13px;margin:6px 0;border-radius:11px;border:1px solid #293452;background:#070d1b;color:#fff;outline:0}.mainbtn{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:700}.switch{text-align:center;color:#94a3b8;margin-top:15px}.switch b{color:#a78bfa;cursor:pointer}#app{display:none}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#070d1b;border-bottom:1px solid #1f2937}.online{color:#4ade80;font-weight:700}.logout{border:0;border-radius:10px;padding:10px 15px;background:#ef4444;color:#fff}.wrap{padding:32px}.title{font-size:32px;font-weight:900}.sub{color:#94a3b8;margin:7px 0 28px}.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{padding:21px;border-radius:20px;background:#0b1224;border:1px solid #202c46}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#06b6d4);font-size:25px;font-weight:800;margin-bottom:14px}.name{font-size:20px;font-weight:800}.info{color:#94a3b8;font-size:14px;margin-top:6px}.green{color:#4ade80;margin-top:9px}.call{width:100%;padding:12px;margin-top:16px;border:0;border-radius:11px;background:#7c3aed;color:#fff;font-weight:700}.empty{text-align:center;color:#64748b;padding:55px}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:10}.callbox{width:min(900px,94%);background:#07101f;padding:18px;border-radius:22px}.videos{height:500px;background:#000;border-radius:16px;overflow:hidden;position:relative}.remote{width:100%;height:100%;object-fit:cover}.local{position:absolute;right:14px;bottom:14px;width:210px;height:145px;object-fit:cover;border:2px solid #fff;border-radius:12px}.controls{display:flex;justify-content:center;gap:9px;margin-top:13px}.ctrl{border:0;padding:11px 16px;border-radius:10px;background:#1e293b;color:#fff}.end{background:#ef4444}.incoming{position:fixed;right:22px;bottom:22px;display:none;width:320px;padding:22px;background:#0b1224;border:1px solid #7c3aed;border-radius:18px;z-index:20}.incoming p{color:#94a3b8}.row{display:flex;gap:8px}.accept,.reject{flex:1;padding:11px;border:0;border-radius:10px;color:#fff}.accept{background:#22c55e}.reject{background:#ef4444}.chatToggle{border:1px solid #7c3aed;border-radius:10px;padding:9px 14px;background:#17102b;color:#fff;font-weight:700;margin-right:auto;margin-left:20px}.chat{position:fixed;right:22px;bottom:22px;width:320px;background:#0b1224;border:1px solid #26324a;border-radius:18px;overflow:hidden;display:none}.chathead{padding:13px;background:#111827;font-weight:700;display:flex;justify-content:space-between}.chathead button{border:0;background:none;color:#fff;font-size:22px}.emojiPanel{display:none;max-height:150px;overflow:auto;padding:8px;background:#080d19;border-top:1px solid #1f2937}.emoji{border:0;background:none;font-size:23px;padding:4px;cursor:pointer}.emojiBtn{border:0;border-radius:9px;background:#1e293b;color:#fff;padding:8px 10px}.msgs{height:220px;overflow:auto;padding:10px}.msg{padding:8px 10px;margin-bottom:6px;border-radius:9px;background:#1e293b;font-size:13px}.chatrow{display:flex;gap:5px;padding:8px}.chatrow input{flex:1;padding:10px;border:0;border-radius:9px;background:#070d1b;color:#fff}.chatrow button{border:0;border-radius:9px;background:#7c3aed;color:#fff;padding:10px 14px}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}@media(max-width:700px){header{padding:0 15px}.wrap{padding:20px}.videos{height:400px}.local{width:140px;height:100px}}
</style></head><body>
<div id="auth" class="auth"><div class="box"><div class="logo">NEX<span>ORA</span></div><div id="authText" class="muted">Create your account</div><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><div id="reg"><input id="age" type="number" min="13" placeholder="Age"><select id="gender"><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select></div><button id="authBtn" class="mainbtn">CREATE ACCOUNT</button><div id="switch" class="switch">Already have account? <b>Login</b></div></div></div>
<div id="app"><header><button id="chatToggle" class="chatToggle">💬 CHAT</button><div class="logo">NEX<span>ORA</span></div><div class="online">🟢 <span id="count">0</span> ONLINE</div><button id="logout" class="logout">LOGOUT</button></header><div class="wrap"><div class="title">Discover people</div><div class="sub">Everyone currently online</div><div id="users" class="users"></div></div></div>
<div id="incoming" class="incoming"><h3>📹 Incoming video call</h3><p><b id="caller"></b> is calling you.</p><div class="row"><button id="accept" class="accept">ACCEPT</button><button id="reject" class="reject">REJECT</button></div></div>
<div id="call" class="modal"><div class="callbox"><h3>Video call — <span id="callName"></span></h3><div class="videos"><video id="remote" class="remote" autoplay playsinline></video><video id="local" class="local" autoplay muted playsinline></video></div><div class="controls"><button id="mic" class="ctrl">🎤 MIC</button><button id="cam" class="ctrl">📷 CAMERA</button><button id="react" class="ctrl">✨ REACT</button><button id="end" class="ctrl end">☎ END</button></div></div></div>
<div id="chat" class="chat"><div class="chathead">💬 NEXORA Premium Chat <button id="chatClose">×</button></div><div id="msgs" class="msgs"></div><div id="emojiPanel" class="emojiPanel"></div><div class="chatrow"><button id="emojiBtn" class="emojiBtn">✨</button><input id="message" placeholder="Write a message..."><button id="send">➤</button></div></div>
<script>
let ws=null,me=null,register=true,stream=null,pc=null,target=null,pending=null;
const premiumEmojis=["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥳","🤩","🥹","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🫡","🤭","🤫","🤥","😶","🫠","🙄","😬","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕","🤑","🤠","😈","👿","👹","👺","🤡","💩","👻","💀","☠️","👽","👾","🤖","🎃","😺","😸","😹","😻","😼","😽","🙀","😿","😾","🙈","🙉","🙊","💋","💯","💥","💫","💦","💨","🕳️","💣","💬","👋","🤚","🖐️","✋","🖖","👌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","👇","☝️","👍","👎","✊","👊","🤝","🙏","👏","🙌","🫶","💪","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❤️‍🔥","💕","💞","💓","💗","💖","💘","💝","💟","✨","⭐","🌟","🔥","🎉","🎊","🎁","🏆","🥇","🚀","⚡","💎","👑","💰","💸","🎯","🎮","🎧","🎵","🎶","📸","📹","💻","📱","🌈","☀️","🌙","🌎","🍕","🍔","🍟","🌭","🍿","🍩","🍪","🍓","🍉","🍇","☕","🥤","🍾","⚽","🏀","🏈","⚾","🎾","🏎️","✈️","🚗","🏠","💡","🔒","🔓","🔔","🔕","❤️","🔥","😂","🤣","😍","🤬","😎","🤡","💀","👀","🫣","🗿","🦄","🐶","🐱","🐼","🦊","🐸","🐵","🦁","🐯","🐨","🐻","🐰","🐼","🐧","🐦","🦋","🌹","🌸","🌺","🌻","🍀","🌴","🌊","❄️","☄️","🌌","🎆","🎇","🧨","🛸","👾","🤖","💻","🧠","🫀","🫁","👁️","🧿","🔮","🪄","⚔️","🛡️","🏹","🔱","☠️","💀","👻","👹","😈","👿","🩸","🧪","⚠️","🚨","❗","❓","‼️","⁉️","✔️","❌","⭕","🔴","🟠","🟡","🟢","🔵","🟣","⚫","⚪","🩷","🩵","🩶","🤍","🫶","🫵","🗣️","👂","👀","🧏","💅","🫦","🧘","🏃","💃","🕺","🧑‍💻","🧑‍🚀","🦸","🦹","🧙","🧛","🧟","🧞","🧚","🎅","🤰","👶","🧒","🧑","👨","👩","🧔","👨‍🚀","👩‍🚀"];
const $=id=>document.getElementById(id);
function buildEmojiPanel(){$('emojiPanel').innerHTML=premiumEmojis.map(e=>`<button class="emoji" title="Premium emoji">${e}</button>`).join('');document.querySelectorAll('.emoji').forEach(b=>b.onclick=()=>{const i=$('message');i.value+=b.textContent;i.focus()})}buildEmojiPanel();
$('chatToggle').onclick=()=>{$('chat').style.display='block'};$('chatClose').onclick=()=>{$('chat').style.display='none'};$('emojiBtn').onclick=()=>{$('emojiPanel').style.display=$('emojiPanel').style.display==='block'?'none':'block'};
function showReaction(e){const r=document.createElement('div');r.textContent=e;r.style.cssText='position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);font-size:72px;z-index:99;animation:pop 1.4s ease forwards;pointer-events:none';document.body.appendChild(r);setTimeout(()=>r.remove(),1400)}
function sendReaction(e){if(target)send({type:'signal',to:target,data:{kind:'reaction',emoji:e}});showReaction(e)}
function connect(){ws=new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);ws.onopen=()=>console.log('connected');ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='auth'){if(!m.ok)return alert(m.message);me=m.user;$('auth').style.display='none';$('app').style.display='block'}if(m.type==='users')render(m.users);if(m.type==='signal')signal(m);if(m.type==='chat')addMsg(m.from,m.message);if(m.type==='signal'&&m.data?.kind==='reaction')showReaction(m.data.emoji)};ws.onclose=()=>console.log('socket closed')}
function send(o){ws.send(JSON.stringify(o))}
$('switch').onclick=()=>{register=!register;$('reg').style.display=register?'block':'none';$('authBtn').textContent=register?'CREATE ACCOUNT':'LOGIN';$('authText').textContent=register?'Create your account':'Login to NEXORA';$('switch').innerHTML=register?'Already have account? <b>Login</b>':'No account? <b>Register</b>'};
$('authBtn').onclick=()=>{const d={type:register?'register':'login',username:$('username').value.trim(),password:$('password').value,age:$('age').value,gender:$('gender').value};if(!d.username||!d.password)return alert('Username and password required');send(d)};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(list){const a=list.filter(x=>x.username!==me?.username);$('count').textContent=a.length;$('users').innerHTML=a.length?a.map(u=>`<div class="card"><div class="avatar">${esc(u.username[0].toUpperCase())}</div><div class="name">${esc(u.username)}</div><div class="info">Age: ${esc(u.age)}</div><div class="info">Gender: ${esc(u.gender)}</div><div class="green">🟢 ONLINE</div><button class="call" data-u="${esc(u.username)}">📹 VIDEO CALL</button></div>`).join(''):'<div class="empty">👥<br><br>No other users online.<br><br>Open NEXORA on another device and login.</div>';document.querySelectorAll('.call').forEach(b=>b.onclick=()=>startCall(b.dataset.u))}
async function media(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;return true}catch(e){alert('Camera/microphone permission required.');return false}}
function mkPeer(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:'signal',to:target,data:{kind:'ice',candidate:e.candidate}})}
async function startCall(u){target=u;if(!await media())return;mkPeer();$('callName').textContent=u;$('call').style.display='grid';const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'signal',to:u,data:{kind:'offer',offer}})}
async function signal(m){const d=m.data;if(d.kind==='offer'){pending={from:m.from,offer:d.offer};$('caller').textContent=m.from;$('incoming').style.display='block'}else if(d.kind==='answer'){if(pc)await pc.setRemoteDescription(new RTCSessionDescription(d.answer))}else if(d.kind==='ice'){if(pc)try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate))}catch(e){}}else if(d.kind==='end'){closeCall()}}
$('accept').onclick=async()=>{if(!pending)return;target=pending.from;if(!await media())return;mkPeer();$('callName').textContent=target;$('call').style.display='grid';await pc.setRemoteDescription(new RTCSessionDescription(pending.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'signal',to:target,data:{kind:'answer',answer}});$('incoming').style.display='none';pending=null};$('reject').onclick=()=>{$('incoming').style.display='none';pending=null};
function closeCall(){if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('local').srcObject=null;$('remote').srcObject=null;$('call').style.display='none';target=null}$('react').onclick=()=>sendReaction(premiumEmojis[Math.floor(Math.random()*premiumEmojis.length)]);$('end').onclick=()=>{if(target)send({type:'signal',to:target,data:{kind:'end'}});closeCall()};$('mic').onclick=()=>stream&&stream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);$('cam').onclick=()=>stream&&stream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);
$('logout').onclick=()=>location.reload();function addMsg(f,t){const d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+esc(f)+'</b><br>'+esc(t);$('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight}$('send').onclick=()=>{const i=$('message');if(i.value.trim())send({type:'chat',message:i.value.trim()});i.value=''};$('message').onkeydown=e=>{if(e.key==='Enter')$('send').click()};connect();
</script></body></html>
