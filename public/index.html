<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NEXORA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .callbox { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 600px; }
        .videos { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        video { width: 45%; background: black; border-radius: 8px; }
        .controls button { padding: 10px 15px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .ctrl { background: #3b82f6; color: white; }
        .ctrl.end { background: #ef4444; color: white; }
        .chat { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #1e293b; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .chathead { background: #334155; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .msgs { height: 200px; overflow-y: auto; padding: 10px; font-size: 14px; }
        .msg { margin-bottom: 8px; }
        .chatrow { display: flex; border-top: 1px solid #334155; }
        .chatrow input { flex: 1; padding: 8px; border: none; background: #0f172a; color: white; outline: none; }
        .chatrow button { background: #3b82f6; color: white; border: none; padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>

<div id="incoming" style="display:none; background:#334155; padding:15px; border-radius:8px; margin-bottom:15px;">
    Incoming call from <span id="caller" style="font-weight:bold;"></span> 
    <button id="accept" style="background:#22c55e; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Accept</button>
    <button id="reject" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Reject</button>
</div>

<div id="call" class="modal">
    <div class="callbox">
        <h3>Video call — <span id="callName"></span></h3>
        <div class="videos">
            <video id="remote" class="remote" autoplay playsinline></video>
            <video id="local" class="local" autoplay muted playsinline></video>
        </div>
        <div class="controls">
            <button id="mic" class="ctrl">🎤 MIC</button>
            <button id="cam" class="ctrl">📷 CAMERA</button>
            <button id="react" class="ctrl">✨ REACT</button>
            <button id="end" class="ctrl end">☎ END</button>
        </div>
    </div>
</div>

<div id="chat" class="chat">
    <div class="chathead">💬 NEXORA Premium Chat <button id="chatClose" style="background:none; border:none; color:white; cursor:pointer; font-size:16px;">×</button></div>
    <div id="msgs" class="msgs"></div>
    <div id="emojiPanel" class="emojiPanel" style="display:flex; flex-wrap:wrap; max-height:100px; overflow-y:auto; padding:5px; background:#0f172a;"></div>
    <div class="chatrow">
        <button id="emojiBtn" class="emojiBtn">✨</button>
        <input id="message" placeholder="Write a message...">
        <button id="send">➤</button>
    </div>
</div>

<div>Online users count: <span id="count">0</span></div>
<div id="users"></div>
<button id="logout" style="margin-top:15px; background:#ef4444; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">Logout</button>

<script>
let ws=null, me=null, register=true, stream=null, pc=null, target=null, pending=null, iceQueue=[];
const premiumEmojis=["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🥳","🤩","🥹","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🫡","🤭","🤫","🤥","😶","🫠","🙄","😬","😮","😲","🥱","😴","🤤","😪","😵","🤐","🥴","🤢","🤮","🤧","😷","🤒","🤕","🤑","🤠","😈","👿","👹","👺","🤡","💩","👻","💀","☠️","👽","👾","🤖","🎃","😺","😸","😹","😻","😼","😽","🙀","😿","😾","🙈","🙉","🙊","💋","💯","💥","💫","💦","💨","🕳️","💣","💬","👋","🤚","🖐️","✋","🖖","👌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","👇","☝️","👍","👎","✊","👊","🤝","🙏","👏","🙌","🫶","💪","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❤️‍🔥","💕","💞","💓","💗","💖","💘","💝","💟","✨","⭐","🌟","🔥","🎉","🎊","🎁","🏆","🥇","🚀","⚡","💎","👑","💰","💸","🎯","🎮","🎧","🎵","🎶","📸","📹","💻","📱","🌈","☀️","🌙","🌎","🍕","🍔","🍟","🌭","🍿","🍩","🍪","🍓","🍉","🍇","☕","🥤","🍾","⚽","🏀","🏈","⚾","🎾","🏎️","✈️","🚗","🏠","💡","🔒","🔓","🔔","🔕"];
const $=id=>document.getElementById(id);

function buildEmojiPanel(){
    $('emojiPanel').innerHTML=premiumEmojis.map(e=>`<button class="emoji" title="Premium emoji" style="background:none;border:none;cursor:pointer;font-size:18px;padding:2px;">${e}</button>`).join('');
    document.querySelectorAll('.emoji').forEach(b=>b.onclick=()=>{const i=$('message');i.value+=b.textContent;i.focus()})
}
buildEmojiPanel();

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function render(list){
    const a=list.filter(x=>x.username!==me?.username);
    $('count').textContent=a.length;
    $('users').innerHTML=a.length?a.map(u=>`<div style="background:#1e293b; padding:10px; margin:5px 0; border-radius:6px; display:flex; justify-content:space-between; align-items:center;"><div><b>${esc(u.username)}</b> <span style="color:#22c55e;">🟢 ONLINE</span></div><button class="call" data-u="${esc(u.username)}" style="background:#3b82f6; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">📹 VIDEO CALL</button></div>`).join(''):'<div style="color:#94a3b8;">No other users online.</div>';
    document.querySelectorAll('.call').forEach(b=>b.onclick=()=>startCall(b.dataset.u))
}

async function media(){
    try{
        stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        $('local').srcObject=stream;
        return true;
    }catch(e){
        alert('Camera/microphone permission required.');
        return false;
    }
}

function mkPeer(){
    iceQueue=[];
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.ontrack=e=>{if(e.streams&&e.streams[0])$('remote').srcObject=e.streams[0];};
    pc.onicecandidate=e=>{if(e.candidate&&target)send({type:'signal',to:target,data:{kind:'ice',candidate:e.candidate}})};
    pc.onconnectionstatechange=()=>{if(pc&&(pc.connectionState==='failed'||pc.connectionState==='disconnected'))console.log('WebRTC state:',pc.connectionState)};
}

async function startCall(u){
    target=u;
    if(!await media())return;
    mkPeer();
    $('callName').textContent=u;
    $('call').style.display='flex';
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({type:'signal',to:u,data:{kind:'offer',offer}});
}

async function signal(m){
    const d=m.data;
    if(d.kind==='offer'){
        pending={from:m.from,offer:d.offer};
        $('caller').textContent=m.from;
        $('incoming').style.display='block';
    }else if(d.kind==='answer'){
        if(pc){
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
            for(const c of iceQueue){try{await pc.addIceCandidate(c)}catch(e){console.error('queued ICE error',e)}}
            iceQueue=[];
        }
    }else if(d.kind==='ice'){
        if(!pc)return;
        try{
            const c=new RTCIceCandidate(d.candidate);
            if(pc.remoteDescription&&pc.remoteDescription.type)await pc.addIceCandidate(c);
            else iceQueue.push(c);
        }catch(e){console.error('ICE error',e)}
    }else if(d.kind==='end'){
        closeCall();
    }
}

$('accept').onclick=async()=>{
    if(!pending)return;
    target=pending.from;
    if(!await media())return;
    mkPeer();
    $('callName').textContent=target;
    $('call').style.display='flex';
    await pc.setRemoteDescription(new RTCSessionDescription(pending.offer));
    for(const c of iceQueue){try{await pc.addIceCandidate(c)}catch(e){console.error('queued ICE error',e)}}
    iceQueue=[];
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({type:'signal',to:target,data:{kind:'answer',answer}});
    $('incoming').style.display='none';
    pending=null;
};

$('reject').onclick=()=>{$('incoming').style.display='none';pending=null};

function closeCall(){
    if(pc){pc.close();pc=null}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    $('local').srcObject=null;
    $('remote').srcObject=null;
    $('call').style.display='none';
    target=null;
}

$('react').onclick=()=>send({type:'chat',message: premiumEmojis[Math.floor(Math.random()*premiumEmojis.length)]});
$('end').onclick=()=>{if(target)send({type:'signal',to:target,data:{kind:'end'}});closeCall()};$('mic').onclick=()=>stream&&stream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);
$('cam').onclick=()=>stream&&stream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);$('logout').onclick=()=>location.reload();

function addMsg(f,t){
    const d=document.createElement('div');
    d.className='msg';
    d.innerHTML=`<b>${esc(f)}:</b> ${esc(t)}`;
    $('msgs').appendChild(d);
    $('msgs').scrollTop=$('msgs').scrollHeight;
}

$('send').onclick=()=>{
    const i=$('message');
    if(i.value.trim()){
        send({type:'chat',message:i.value.trim()});
        addMsg(me?.username || "Mehmon", i.value.trim());
    }
    i.value='';
};

$('message').onkeydown=e=>{if(e.key==='Enter')$('send').click()};

// WebSocket ulanishini sozlash (Oddiy demo uchun lokal funksiya)
function connect(){
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host);
    
    ws.onopen = () => {
        me = { username: "User_" + Math.floor(Math.random() * 1000) };
        render([me]);
    };
    
    ws.onmessage = (event) => {
        const m = JSON.parse(event.data);
        if(m.type === 'signal') signal(m);
        if(m.type === 'chat') addMsg("Boshqa foydalanuvchi", m.message);
    };
}

function send(data){
    if(ws && ws.readyState === WebSocket.OPEN){
        data.from = me?.username;
        ws.send(JSON.stringify(data));
    }
}

connect();
</script>
</body>
</html>
